# python scripts/export_yolo_pose.py
# python scripts/train_pose.py
# eval val only:
# python scripts/eval_pose.py data=waymo_full data.subset=val model.weights=runs/train/gp4_s1280/weights/best.pt
defaults:
  - data: waymo_full
  - model: yolov8s_pose
  - _self_

seed: 42
export_dir: data/yolo_pose_waymo
val_frac: 0.2

train:
  epochs: 100
  imgsz: 1280
  batch: 4              # T4 16GB; if OOM: train.batch=2
  workers: 2
  amp: true
  device: auto
  patience: 30
  project: runs/train
  name: gp4_s1280
  cos_lr: true
  close_mosaic: 20
  optimizer: AdamW
  lr0: 0.002
  lrf: 0.01
  warmup_epochs: 3.0
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.3
  scale: 0.75
  degrees: 5.0
  fliplr: 0.5
  pose: 12.0
  kobj: 2.0
  plots: true

logging:
  run_name: gp4-s1280
  wandb:
    enabled: true
    project: pose-av
    entity: null
  mlflow:
    enabled: false
    tracking_uri: null
    experiment: pose-av

hydra:
  run:
    dir: runs/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: runs/multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
