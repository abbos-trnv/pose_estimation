[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-av"
version = "0.2.0"
description = "2D pedestrian keypoints in the AV domain (HSE Missing ML)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Тургунов Аббос" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
